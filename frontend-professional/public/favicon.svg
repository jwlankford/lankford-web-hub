<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Mode Gradient: Cyan to Emerald -->
    <linearGradient id="op_cyan_em_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- The Agentic Operator Mark (Centered) -->
  <g transform="translate(181, 181)">
    <!-- The Outer System Loop -->
    <path d="M 0 75 Q 75 0 150 75 Q 75 150 0 75 Z" fill="none" stroke="url(#op_cyan_em_dark)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    
    <!-- The '>' Prompt Symbol -->
    <path d="M 25 35 L 75 75 L 25 115" fill="none" stroke="url(#op_cyan_em_dark)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- The Cursor '_' -->
    <line x1="90" y1="115" x2="140" y2="115" stroke="url(#op_cyan_em_dark)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Central Agentic Core Node -->
    <circle cx="75" cy="75" r="14" fill="#06B6D4" />
    <circle cx="75" cy="75" r="22" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="8 4"/>
  </g>
</svg>
